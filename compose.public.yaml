services:
  setu:
    # Published by .github/workflows/deploy.yml; deploy/setu-update.sh on the
    # VM sets the sha-<commit> image in release.env.
    image: ${SETU_IMAGE:?Set SETU_IMAGE to a published Setu image}
    environment:
      SETU_MODE: public
      SETU_PUBLIC_URL: https://${SETU_DOMAIN:?Set SETU_DOMAIN}
      SETU_SESSION_SECRET: ${SETU_SESSION_SECRET:?Generate a private session secret}
      SETU_TRUSTED_PROXY_CIDRS: 172.30.0.2/32
      SETU_STUN_URLS: ${SETU_STUN_URLS:-}
    networks:
      pairing:
        ipv4_address: 172.30.0.3
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    environment:
      SETU_DOMAIN: ${SETU_DOMAIN:?Set SETU_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      pairing:
        ipv4_address: 172.30.0.2
    depends_on:
      setu:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pairing:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
